name: Bug report
description: Something in heelr does not work as expected
labels: [bug]
body:
  - type: input
    id: heelr-version
    attributes:
      label: heelr version
      description: Output of `heelr --version`
    validations:
      required: true
  - type: input
    id: herdr-version
    attributes:
      label: Herdr version
      description: Output of `herdr --version`
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS and terminal
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Command output or logs, if any
      render: text
    validations:
      required: false
