# heelr tab-colours: one $tabc<slot> token per colour slot. The plugin reports exactly one
# of them per pane (value = tab label), so each agent row shows its tab name once, coloured.
# Generated by `python3 tab_colours.py sidebar` (pins from the plugin's config.toml).
[ui.sidebar.agents]
rows = [
  ["state_icon", "terminal_title_stripped"],
  [
    { token = "$tabc0", bold = true, rules = [{ starts_with = "coordinator", fg = "#fabd2f" }, { starts_with = "review", fg = "#8ec07c" }, { starts_with = "overflow", fg = "#928374" }] },
    { token = "$tabc1", fg = "#fb4934", bold = true },
    { token = "$tabc2", fg = "#b8bb26", bold = true },
    { token = "$tabc3", fg = "#fabd2f", bold = true },
    { token = "$tabc4", fg = "#83a598", bold = true },
    { token = "$tabc5", fg = "#d3869b", bold = true },
    { token = "$tabc6", fg = "#8ec07c", bold = true },
    { token = "$tabc7", fg = "#fe8019", bold = true },
    { token = "$tabc8", fg = "#458588", bold = true },
    { token = "$tabc9", fg = "#b16286", bold = true },
    { token = "$tabc10", fg = "#98971a", bold = true },
    { token = "state_text", dim = true },
  ],
]
